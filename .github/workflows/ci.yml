name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual runs from the "Actions" tab
  schedule: # catch breaking releases of dependencies, even without any push
    - cron: "42 4 1,15 * *" # at 04:42 UTC on the 1st and the 15th of each month

# grant no more than read access, unless a job needs more
permissions:
  contents: read

# cancel outdated runs of the same pull request or branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # run the unit tests on all supported Python versions
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report all failing versions, not only the first one
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[tests]
    - name: Test with unittest
      run: python -m unittest

  # execute the example notebooks, which also serve as documentation
  notebooks:
    name: Example notebooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[notebooks] nbconvert ipykernel
    - name: Execute notebooks
      run: |
        for notebook in examples/*.ipynb; do
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=-1 --output-dir "$RUNNER_TEMP" "$notebook"
        done

  # build the distributions and test the wheel outside of the repository
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Build and check distributions
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check --strict dist/*
    - name: Import the installed wheel
      working-directory: ${{ runner.temp }} # avoid importing the source tree instead
      run: |
        python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
        python -c "import caife; print(caife.__version__, caife.__file__)"

  # build the documentation for every change, to catch errors before merging
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[docs]
    - name: Build documentation
      run: sphinx-build -M html docs/source docs/build
    - name: Upload documentation for GitHub Pages
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/build/html

  # publish the documentation, but only for pushes to the main branch (or manual runs on it)
  # and only if all checks pass; scheduled runs only check, without re-deploying
  deploy-docs:
    name: Deploy documentation
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [ test, notebooks, package, docs ]
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify that the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # never interrupt a running deployment
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
